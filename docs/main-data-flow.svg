<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">UK Wind Forecast Decision Support data flow</title>
  <desc id="desc">Data flows from Elexon actual and forecast APIs through Python processing into a SQLite snapshot, FastAPI, and the React frontend deployed on Vercel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10233f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, Arial, sans-serif; fill: #10233f; }
      .subtitle { font: 400 19px Inter, Arial, sans-serif; fill: #52657d; }
      .section { font: 700 16px Inter, Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; fill: #c9532d; }
      .box-title { font: 700 22px Inter, Arial, sans-serif; fill: #10233f; }
      .box-text { font: 400 17px Inter, Arial, sans-serif; fill: #52657d; }
      .small { font: 600 15px Inter, Arial, sans-serif; fill: #52657d; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="42" y="38" width="1516" height="824" rx="28" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/>
  <text x="88" y="105" class="title">UK Wind Forecast Decision Support</text>
  <text x="88" y="140" class="subtitle">From Elexon BMRS data to a day-ahead buying view and quantified forecast risk</text>

  <text x="88" y="205" class="section">1 · Source data</text>
  <g filter="url(#shadow)">
    <rect x="88" y="230" width="300" height="180" rx="18" fill="#e8f4f2" stroke="#8bc9c0" stroke-width="2"/>
    <rect x="438" y="230" width="300" height="180" rx="18" fill="#fff0e9" stroke="#f1b39e" stroke-width="2"/>
  </g>
  <text x="120" y="280" class="box-title">FUELHH actuals</text>
  <text x="120" y="318" class="box-text">Elexon BMRS</text>
  <text x="120" y="348" class="box-text">WIND · 30-minute values</text>
  <text x="120" y="378" class="box-text">January 2026 delivery scope</text>
  <text x="470" y="280" class="box-title">WINDFOR forecasts</text>
  <text x="470" y="318" class="box-text">Elexon BMRS</text>
  <text x="470" y="348" class="box-text">Hourly generation forecasts</text>
  <text x="470" y="378" class="box-text">Publish time + delivery time</text>

  <text x="88" y="490" class="section">2 · Python data pipeline</text>
  <g filter="url(#shadow)">
    <rect x="88" y="515" width="300" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="438" y="515" width="300" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="788" y="515" width="300" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="120" y="565" class="box-title">Prepare &amp; validate</text>
  <text x="120" y="603" class="box-text">Normalize timestamps</text>
  <text x="120" y="633" class="box-text">Validate fields and records</text>
  <text x="120" y="663" class="box-text">Keep a reproducible scope</text>
  <text x="470" y="565" class="box-title">Select decision forecast</text>
  <text x="470" y="603" class="box-text">Previous-day 09:00 UK cutoff</text>
  <text x="470" y="633" class="box-text">Latest eligible publication</text>
  <text x="470" y="663" class="box-text">Avoid hindsight bias</text>
  <text x="820" y="565" class="box-title">Calculate accuracy</text>
  <text x="820" y="603" class="box-text">Hourly actual aggregation</text>
  <text x="820" y="633" class="box-text">MAE · RMSE · bias · P90</text>
  <text x="820" y="663" class="box-text">Error by hour and horizon</text>

  <text x="1138" y="205" class="section">3 · Application layer</text>
  <g filter="url(#shadow)">
    <rect x="1138" y="230" width="330" height="180" rx="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="1138" y="515" width="330" height="170" rx="18" fill="#10233f" stroke="#10233f" stroke-width="2"/>
  </g>
  <text x="1170" y="280" class="box-title">SQLite snapshot</text>
  <text x="1170" y="318" class="box-text">Read-only bounded data</text>
  <text x="1170" y="348" class="box-text">Actuals · forecasts · metrics</text>
  <text x="1170" y="378" class="box-text">Packaged for reproducible review</text>
  <text x="1170" y="565" style="font:700 22px Inter,Arial,sans-serif;fill:#ffffff">FastAPI backend</text>
  <text x="1170" y="603" style="font:400 17px Inter,Arial,sans-serif;fill:#dbeafe">Health, decision, accuracy endpoints</text>
  <text x="1170" y="633" style="font:400 17px Inter,Arial,sans-serif;fill:#dbeafe">Docker service · JSON API</text>
  <text x="1170" y="663" style="font:400 17px Inter,Arial,sans-serif;fill:#dbeafe">Deployable on Render</text>

  <text x="88" y="785" class="section">4 · Buyer-facing experience</text>
  <g filter="url(#shadow)">
    <rect x="88" y="805" width="1380" height="28" rx="14" fill="#10233f"/>
  </g>
  <text x="118" y="825" style="font:600 15px Inter,Arial,sans-serif;fill:#ffffff">React + TypeScript · Tailwind CSS · shadcn-style components · Vercel deployment</text>
  <text x="118" y="855" class="small">Day-ahead table · forecast/actual chart · metric explanations · filters · CSV export · dark mode</text>

  <path d="M388 320H438" class="line"/>
  <path d="M738 320H1138" class="line"/>
  <path d="M238 410V515" class="line"/>
  <path d="M588 410V515" class="line"/>
  <path d="M888 685V730H300V805" class="line"/>
  <path d="M1303 410V515" class="line"/>
</svg>
