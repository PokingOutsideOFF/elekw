<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Detailed UK Wind Forecast Decision Support data flow</title>
  <desc id="desc">A left-to-right flow showing Elexon data sources, Python processing, SQLite storage, FastAPI, and the React buyer interface.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf7f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#10233f" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#536b88"/></marker>
    <style>
      .title{font:700 40px Inter,Arial,sans-serif;fill:#10233f}.subtitle{font:400 20px Inter,Arial,sans-serif;fill:#52657d}
      .lane{font:700 16px Inter,Arial,sans-serif;letter-spacing:2px;fill:#c9532d}.box-title{font:700 20px Inter,Arial,sans-serif;fill:#10233f}
      .body{font:400 15px Inter,Arial,sans-serif;fill:#52657d}.number{font:700 15px Inter,Arial,sans-serif;fill:#ffffff}.connector{stroke:#536b88;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .connector-dashed{stroke:#8da0b5;stroke-width:2.5;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="1080" fill="url(#background)"/>
  <rect x="38" y="34" width="1724" height="1012" rx="30" fill="#fff" stroke="#dbe4ec" stroke-width="2"/>
  <text x="90" y="105" class="title">UK Wind Forecast Decision Support</text>
  <text x="90" y="142" class="subtitle">Detailed data flow from Elexon BMRS to the buyer-facing application</text>

  <text x="90" y="210" class="lane">1 · ELEXON SOURCE DATA</text>
  <g filter="url(#shadow)">
    <rect x="90" y="235" width="360" height="155" rx="18" fill="#e8f4f2" stroke="#83c9bf" stroke-width="2"/>
    <rect x="510" y="235" width="360" height="155" rx="18" fill="#fff0e9" stroke="#f1ad96" stroke-width="2"/>
  </g>
  <circle cx="122" cy="272" r="16" fill="#0e8e83"/><text x="116" y="278" class="number">A</text>
  <text x="150" y="278" class="box-title">FUELHH actuals</text>
  <text x="122" y="315" class="body">Elexon BMRS · fuelType = WIND</text>
  <text x="122" y="342" class="body">30-minute generation values</text>
  <text x="122" y="369" class="body">Target: January 2026 delivery periods</text>
  <circle cx="542" cy="272" r="16" fill="#e35e35"/><text x="536" y="278" class="number">B</text>
  <text x="570" y="278" class="box-title">WINDFOR forecasts</text>
  <text x="542" y="315" class="body">Elexon BMRS forecast stream</text>
  <text x="542" y="342" class="body">Hourly generation forecasts</text>
  <text x="542" y="369" class="body">publishTime + startTime + generation</text>

  <text x="90" y="475" class="lane">2 · PYTHON DATA PIPELINE</text>
  <g filter="url(#shadow)">
    <rect x="90" y="505" width="250" height="190" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="390" y="505" width="250" height="190" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="690" y="505" width="250" height="190" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="990" y="505" width="250" height="190" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <circle cx="122" cy="542" r="16" fill="#536b88"/><text x="117" y="548" class="number">1</text>
  <text x="150" y="548" class="box-title">Download</text>
  <text x="122" y="590" class="body">Fetch bounded API windows</text>
  <text x="122" y="617" class="body">Print request URLs/status</text>
  <text x="122" y="644" class="body">Save raw responses</text>
  <text x="122" y="671" class="body">Retry/raise HTTP errors</text>
  <circle cx="422" cy="542" r="16" fill="#536b88"/><text x="417" y="548" class="number">2</text>
  <text x="450" y="548" class="box-title">Prepare</text>
  <text x="422" y="590" class="body">Validate required fields</text>
  <text x="422" y="617" class="body">Normalize UTC timestamps</text>
  <text x="422" y="644" class="body">Filter delivery scope</text>
  <text x="422" y="671" class="body">Write processed records</text>
  <circle cx="722" cy="542" r="16" fill="#536b88"/><text x="717" y="548" class="number">3</text>
  <text x="750" y="548" class="box-title">Select</text>
  <text x="722" y="590" class="body">Previous-day 09:00 UK cutoff</text>
  <text x="722" y="617" class="body">Latest eligible publication</text>
  <text x="722" y="644" class="body">Calculate horizon hours</text>
  <text x="722" y="671" class="body">Avoid hindsight bias</text>
  <circle cx="1022" cy="542" r="16" fill="#536b88"/><text x="1017" y="548" class="number">4</text>
  <text x="1050" y="548" class="box-title">Score</text>
  <text x="1022" y="590" class="body">Aggregate actuals hourly</text>
  <text x="1022" y="617" class="body">Join forecast and actual</text>
  <text x="1022" y="644" class="body">MAE · RMSE · bias · P90</text>
  <text x="1022" y="671" class="body">Breakdowns by hour/horizon</text>

  <text x="90" y="775" class="lane">3 · STORAGE AND API</text>
  <g filter="url(#shadow)">
    <rect x="90" y="805" width="390" height="150" rx="18" fill="#eef2ff" stroke="#9eafff" stroke-width="2"/>
    <rect x="550" y="805" width="390" height="150" rx="18" fill="#10233f" stroke="#10233f" stroke-width="2"/>
  </g>
  <circle cx="122" cy="842" r="16" fill="#6b7ee8"/><text x="116" y="848" class="number">5</text>
  <text x="150" y="848" class="box-title">SQLite snapshot</text>
  <text x="122" y="886" class="body">Read-only tables: actuals, forecasts,</text>
  <text x="122" y="913" class="body">decision forecasts, joined accuracy</text>
  <text x="122" y="940" class="body">Reproducible deployment artifact</text>
  <circle cx="582" cy="842" r="16" fill="#fb6a3a"/><text x="576" y="848" class="number">6</text>
  <text x="610" y="848" style="font:700 20px Inter,Arial,sans-serif;fill:#fff">FastAPI backend</text>
  <text x="582" y="886" style="font:400 15px Inter,Arial,sans-serif;fill:#dbeafe">/health · /api/decision</text>
  <text x="582" y="913" style="font:400 15px Inter,Arial,sans-serif;fill:#dbeafe">/api/accuracy/summary</text>
  <text x="582" y="940" style="font:400 15px Inter,Arial,sans-serif;fill:#dbeafe">/api/accuracy/timeseries</text>

  <text x="1010" y="775" class="lane">4 · BUYER-FACING PRODUCT</text>
  <g filter="url(#shadow)"><rect x="1010" y="805" width="660" height="150" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/></g>
  <circle cx="1042" cy="842" r="16" fill="#10233f"/><text x="1036" y="848" class="number">7</text>
  <text x="1070" y="848" class="box-title">React frontend</text>
  <text x="1042" y="886" class="body">Day-ahead table with forecast, actual, error, and horizon</text>
  <text x="1042" y="913" class="body">Accuracy chart, metric tooltips, filters, CSV export, dark mode</text>
  <text x="1042" y="940" class="body">Tailwind CSS · shadcn-style components · Vercel</text>

  <!-- Source connectors terminate at the first pipeline boxes. -->
  <path d="M270 390V430H50V505H150" class="connector"/>
  <path d="M690 390V430H365V505H300" class="connector"/>
  <!-- Pipeline connectors are aligned horizontally and never cross text. -->
  <path d="M340 600H390" class="connector"/>
  <path d="M640 600H690" class="connector"/>
  <path d="M940 600H990" class="connector"/>
  <!-- Storage and API connectors are a separate lower lane. -->
  <path d="M1115 695V730H50V805H270" class="connector"/>
  <path d="M480 880H550" class="connector"/>
  <path d="M940 880H1010" class="connector"/>
</svg>
